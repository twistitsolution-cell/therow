<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/jpeg" href="/images/brand/logo.webp" />

    <title>The Row Residential Hotel &amp; Apartment — Bole, Addis Ababa</title>
    <meta
      name="description"
      content="Unwind in luxury at The Row Residential Hotel. Forty-one rooms, suites and serviced apartments in Bole, Addis Ababa — five minutes from Bole International Airport, opposite Millennium Hall."
    />
    <meta name="theme-color" content="#F8F6F2" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="The Row Residential Hotel &amp; Apartment" />
    <meta
      property="og:description"
      content="Rooms, suites and serviced apartments in Bole, Addis Ababa. Five minutes from the airport."
    />
    <meta property="og:image" content="/images/feature/facade.webp" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Hotel",
        "name": "The Row Residential Hotel",
        "description": "Luxury residential hotel and serviced apartments in Bole, Addis Ababa.",
        "starRating": { "@type": "Rating", "ratingValue": "4" },
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Bole, in front of Millennium Hall",
          "addressLocality": "Addis Ababa",
          "addressCountry": "ET"
        },
        "telephone": "+251116662130",
        "email": "marketing@therowresidentialhotel.com",
        "priceRange": "$$$"
      }
    </script>
  </head>
  <body>
    <!--
      Netlify Forms detection.

      Netlify parses the DEPLOYED HTML at build time to discover forms; it never sees the React
      tree. These hidden copies are what register "booking-enquiry" and "contact" so the runtime
      submissions in src/lib/netlifyForms.js are accepted rather than 404'd.

      Field names MUST match the keys posted from that module. They are the fallback path used
      whenever the .NET API is unreachable — which is the normal state of a frontend-only deploy.
      Delete these and the live site silently stops capturing enquiries.
    -->
    <form name="booking-enquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="booking-enquiry" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="phone" />
      <input type="text" name="country" />
      <input type="text" name="room-type" />
      <input type="text" name="check-in" />
      <input type="text" name="check-out" />
      <input type="text" name="nights" />
      <input type="text" name="adults" />
      <input type="text" name="children" />
      <input type="text" name="payment-preference" />
      <textarea name="requests"></textarea>
    </form>

    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="phone" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
