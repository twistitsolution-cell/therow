# Netlify configuration.
#
# ONE site serves both apps: the public website at the root, and the admin panel at /admin.
# They are deployed together because creating a second Netlify site needs dashboard access, and
# a single deploy keeps the two in lockstep — you cannot ship a frontend change that the admin
# has not been rebuilt against.
#
# No `base` is set, so `publish` is resolved from the repository root. That is deliberate: with
# `base` set, `publish` becomes relative to it, and `web/dist` would silently resolve to
# `web/web/dist`.

[build]
  publish = "web/dist"
  command = """
    npm --prefix web ci && npm --prefix web run build && \
    npm --prefix admin ci && npm --prefix admin run build && \
    rm -rf web/dist/admin && cp -r admin/dist web/dist/admin
  """

[build.environment]
  # Vite 5 needs Node 18+; 22 matches what the project was developed and tested against.
  NODE_VERSION = "22"

# ---------------------------------------------------------------------------
# Redirects are evaluated top-down and the FIRST match wins, so the admin rule
# must precede the site-wide SPA fallback. Reverse them and every /admin route
# renders the public homepage instead.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---------------------------------------------------------------------------
# Caching. Vite fingerprints everything under /assets, so those are immutable.
# Both index.html files must stay uncached or a deploy is never picked up.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/admin/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    # Declared AFTER the catch-all so these win: Netlify applies every matching rule in
    # file order and the last value for a header is the one served.
    X-Robots-Tag = "noindex, nofollow, noarchive"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
