# Netlify configuration for the ADMIN PANEL.
#
# Deploy this as a SECOND Netlify site from the same repository, with
# "Base directory" set to `admin`. Netlify then reads this file and `publish = "dist"`
# resolves to admin/dist.
#
# The admin panel is useless without the .NET API — it is entirely authenticated calls.
# Set VITE_API_BASE_URL on the site before deploying, and add the resulting Netlify URL to
# the API's Cors:AllowedOrigins or every request will fail preflight.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The back office should never be indexed or framed.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
